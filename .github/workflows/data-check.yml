name: Data Freshness

# Compares every committed country file with its official source. A failed run
# means a regulator's list changed: refresh the country locally with
# `python -m src.refresh <CODE>`, review the diff, and commit it.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compare data files with their sources
      run: python -m src.refresh all --check
