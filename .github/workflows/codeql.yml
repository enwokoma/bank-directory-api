name: CodeQL

# Scans the Python code and the workflows with CodeQL on every change to main,
# on pull requests against it, and once a week to pick up newly published
# queries. Findings appear under the repository's Security tab, and on a pull
# request as annotations; the run itself fails only when the analysis cannot run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up CodeQL for ${{ matrix.language }}
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
