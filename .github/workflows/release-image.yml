name: Release image

# Makes a release when a signed release tag vX.Y.Z is pushed. The tag must be
# signed, as GitHub verifies it, match the version in src/__init__.py and have
# its section in CHANGELOG.md. Then, in parallel:
#
# - The GitHub release is created with that changelog section as its notes,
#   and every country's data file, as it is at the tag, is attached with a
#   SHA256SUMS file (scripts/create-release.sh). A release that already exists
#   keeps its notes and only gets the files.
# - The API's image is published to the GitHub Container Registry. Each
#   architecture is built natively on its own runner, so nothing is emulated
#   and no third-party action runs; the two are then joined under the version,
#   its minor version and latest, and GitHub attests the joined image's build
#   provenance (docs/deploy.md says how to verify it).
#
# Then, when the repository has the COOLIFY_WEBHOOK_URL and COOLIFY_API_TOKEN
# secrets, the public instance is redeployed through Coolify's deploy webhook,
# and when it has the PUBLIC_SITE_URL variable, the job waits until the site
# answers with the new version. Without them the image is only published.
#
# Running the workflow by hand (gh workflow run release-image.yml) builds
# nothing and creates no release: it redeploys the latest published image and
# checks that the site answers with the version on main, which is the latest
# release's. That repeats a deployment that did not happen, or tests the
# deployment itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/enwokoma/bank-directory-api

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check that the tag is signed, matches the version and has its changelog section
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          expected=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/__init__.py").read()).group(1))')
          if [ "$EVENT" = workflow_dispatch ]; then
            # A manual run deploys the latest published image, which is the release main's version names.
            echo "version=$expected" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          fi
          if [ "$version" != "$expected" ]; then
            echo "::error::$TAG does not match src/__init__.py, which says $expected"
            exit 1
          fi
          if ! awk -v heading="## $version - " 'index($0, heading) == 1 { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $version - <date>' section, which the release notes come from"
            exit 1
          fi
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; push an annotated, signed one (git tag -s)"
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.verified')" != true ]; then
            echo "::error::GitHub could not verify the signature on $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    name: Create the GitHub release
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create the release from its changelog section and attach the data files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: scripts/create-release.sh "$TAG"

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.check.outputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and push the ${{ matrix.arch }} image
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker build --tag "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  publish:
    name: Publish
    needs: [check, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Join both architectures under the version, its minor version and latest
        id: join
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # Right after a push, the registry can take a few seconds to serve the new manifests by
          # digest ("not found"), so the join is tried a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
                --tag "$IMAGE:$VERSION" --tag "$IMAGE:${VERSION%.*}" --tag "$IMAGE:latest" \
                "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Attest the joined image's build provenance
        # Signs a statement that this workflow run built the image index, kept by GitHub and
        # pushed to the registry next to the image; gh attestation verify checks it.
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to the public instance
    needs: [check, publish]
    # On a tag push, after the image is published; on a manual run, with nothing built.
    if: ${{ !cancelled() && needs.check.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Ask Coolify to redeploy the service, and wait for it
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK_URL and COOLIFY_API_TOKEN are not set, so the public instance is not deployed."
            exit 0
          fi
          # The webhook queues a deployment of the service, which pulls the image its compose file
          # names: latest, which the publish job has just moved to this release. Coolify answers
          # 405 to GET on this endpoint, so it is called with POST.
          response=$(curl --silent --show-error --fail --request POST "$COOLIFY_WEBHOOK_URL" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header "Accept: application/json")
          resource=$(printf '%s' "$response" | jq -r '.deployments[0].resource_uuid // empty')
          if [ -z "$resource" ]; then
            echo "::error::Coolify did not start a deployment: $response"
            exit 1
          fi
          deployment=$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment" ]; then
            # A Docker Compose service reports no deployment to follow, only that it started;
            # the next step then watches the site itself.
            printf '%s\n' "$response" | jq -r '.deployments[0].message'
            exit 0
          fi
          echo "Coolify queued deployment $deployment."
          api="${COOLIFY_WEBHOOK_URL%%/api/v1/deploy*}/api/v1/deployments/$deployment"
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --fail --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header "Accept: application/json" "$api" | jq -r '.status // empty')
            case "$status" in
              finished) echo "Deployment finished."; exit 0 ;;
              failed|cancelled*) echo "::error::Deployment $status; see the deployment's log in Coolify."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The deployment did not finish within 10 minutes; its last status was '$status'."
          exit 1

      - name: Check that the site answers with the new version
        if: env.PUBLIC_SITE_URL != '' && env.COOLIFY_WEBHOOK_URL != '' && env.COOLIFY_API_TOKEN != ''
        run: |
          # Pulling the image and starting the new container takes a while, during which the old
          # one may still answer, so the site is given time and then watched for up to five minutes.
          # A manual run redeploys the version already live, so there the check proves that the
          # site is up and on that version once the restart is through.
          sleep 60
          for attempt in $(seq 1 30); do
            live=$(curl --silent "$PUBLIC_SITE_URL/apispec_1.json" | jq -r '.info.version // empty' || true)
            healthy=$(curl --silent --output /dev/null --write-out '%{http_code}' "$PUBLIC_SITE_URL/" || true)
            if [ "$live" = "$VERSION" ] && [ "$healthy" = 200 ]; then
              echo "$PUBLIC_SITE_URL is healthy and answers with version $VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PUBLIC_SITE_URL answers with version '${live:-nothing}' and health status ${healthy:-none}, not $VERSION and 200."
          exit 1
