name: Release image

# Publishes the API's image to the GitHub Container Registry when a signed
# release tag vX.Y.Z is pushed. The tag must be signed, as GitHub verifies it,
# and match the version in src/__init__.py. Each architecture is built natively
# on its own runner, so nothing is emulated and no third-party action runs;
# the two are then joined under the version, its minor version and latest.
#
# Then, when the repository has the COOLIFY_WEBHOOK_URL and COOLIFY_API_TOKEN
# secrets, the public instance is redeployed through Coolify's deploy webhook,
# and when it has the PUBLIC_SITE_URL variable, the job waits until the site
# answers with the new version. Without them the image is only published.
#
# Running the workflow by hand on a release tag (gh workflow run
# release-image.yml --ref vX.Y.Z) rebuilds and redeploys that release, for a
# deploy that did not happen or to test the deployment itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/enwokoma/bank-directory-api

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check that the tag is signed and matches the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not vX.Y.Z"
            exit 1
          fi
          expected=$(python3 -c 'import re; print(re.search(r"__version__ = \"(.+)\"", open("src/__init__.py").read()).group(1))')
          if [ "$version" != "$expected" ]; then
            echo "::error::$TAG does not match src/__init__.py, which says $expected"
            exit 1
          fi
          read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          if [ "$type" != tag ]; then
            echo "::error::$TAG is a lightweight tag; push an annotated, signed one (git tag -s)"
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.verification.verified')" != true ]; then
            echo "::error::GitHub could not verify the signature on $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: check
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.check.outputs.version }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and push the ${{ matrix.arch }} image
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker build --tag "$IMAGE:$TAG" .
          docker push "$IMAGE:$TAG"

  publish:
    name: Publish
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Join both architectures under the version, its minor version and latest
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          # Right after a push, the registry can take a few seconds to serve the new manifests by
          # digest ("not found"), so the join is tried a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools create \
                --tag "$IMAGE:$VERSION" --tag "$IMAGE:${VERSION%.*}" --tag "$IMAGE:latest" \
                "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  deploy:
    name: Deploy to the public instance
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.check.outputs.version }}
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
    steps:
      - name: Ask Coolify to redeploy the service, and wait for it
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::notice::COOLIFY_WEBHOOK_URL and COOLIFY_API_TOKEN are not set, so the public instance is not deployed."
            exit 0
          fi
          # The webhook queues a deployment of the service, which pulls the image its compose file
          # names: latest, which the publish job has just moved to this release.
          response=$(curl --silent --show-error --fail --request GET "$COOLIFY_WEBHOOK_URL" \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" --header "Accept: application/json")
          deployment=$(printf '%s' "$response" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$deployment" ]; then
            echo "::error::Coolify did not queue a deployment: $response"
            exit 1
          fi
          echo "Coolify queued deployment $deployment."
          api="${COOLIFY_WEBHOOK_URL%%/api/v1/deploy*}/api/v1/deployments/$deployment"
          for attempt in $(seq 1 60); do
            status=$(curl --silent --show-error --fail --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --header "Accept: application/json" "$api" | jq -r '.status // empty')
            case "$status" in
              finished) echo "Deployment finished."; exit 0 ;;
              failed|cancelled*) echo "::error::Deployment $status; see the deployment's log in Coolify."; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::The deployment did not finish within 10 minutes; its last status was '$status'."
          exit 1

      - name: Check that the site answers with the new version
        if: env.PUBLIC_SITE_URL != '' && env.COOLIFY_WEBHOOK_URL != '' && env.COOLIFY_API_TOKEN != ''
        run: |
          for attempt in $(seq 1 30); do
            live=$(curl --silent "$PUBLIC_SITE_URL/apispec_1.json" | jq -r '.info.version // empty' || true)
            if [ "$live" = "$VERSION" ]; then
              echo "$PUBLIC_SITE_URL answers with version $VERSION."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PUBLIC_SITE_URL still answers with version '${live:-nothing}', not $VERSION."
          exit 1
